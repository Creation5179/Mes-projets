<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Todo TDAH Friendly</title>
<style>
:root {
--ink: #24303A;
--ink-muted: #64737C;
--page-bg: #F1F3F2;
--surface: #FFFFFF;
--line: #D8DCDB;
--grid-dot: #E4E8EA;
--accent-teal: #1F7A82;
--accent-teal-dark: #175D63;
--accent-red: #D2483C;
}
* { box-sizing: border-box; }
html, body {
margin: 0; padding: 0;
background: var(--page-bg);
color: var(--ink);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
-webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
.app-shell { max-width: 1100px; margin: 0 auto; padding: 14px 14px 48px; }

/* Header + breadcrumb */
.app-header {
display: flex; align-items: center; justify-content: space-between;
padding-bottom: 10px; margin-bottom: 4px;
}
.app-header--day { justify-content: flex-start; gap: 4px; }
.brand { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.01em; color: var(--accent-teal-dark); }
.brand--link { cursor: pointer; }
.brand--link:hover { color: var(--accent-teal); }
.btn-reset {
background: none; border: 1px solid var(--line); color: var(--ink-muted);
border-radius: 6px; padding: 5px 10px; font-size: 0.72rem; cursor: pointer;
}
.btn-reset:hover { border-color: var(--accent-red); color: var(--accent-red); }
.header-actions { display: flex; gap: 8px; }
.breadcrumb { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 16px; }

/* Écran de verrouillage */
.gate { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.gate-card {
background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
padding: 28px 24px; max-width: 300px; width: 100%; text-align: center;
}
.gate-brand { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
.gate-hint { color: var(--ink-muted); font-size: 0.85rem; margin: 0 0 16px; }
.gate-card input[type="password"] {
width: 100%; border: 1px solid var(--line); border-radius: 8px;
padding: 10px; font: inherit; font-size: 0.95rem; margin-bottom: 10px; text-align: center;
}
.gate-card .btn { width: 100%; padding: 9px; font-size: 0.9rem; }
.gate-error { color: var(--accent-red); font-size: 0.8rem; margin-top: 10px; }
.crumb { cursor: pointer; }
.crumb:hover { color: var(--accent-teal); }
.crumb--active { color: var(--ink); font-weight: 600; cursor: default; }
.crumb--active:hover { color: var(--ink); }
.sep { margin: 0 4px; }
.back-arrow {
display: inline-flex; align-items: center; justify-content: center;
width: 24px; height: 24px; margin-right: 4px;
border: none; border-radius: 50%; background: transparent;
color: var(--accent-teal); font-size: 1rem; line-height: 1;
cursor: pointer; padding: 0; vertical-align: middle;
}
.back-arrow:hover { background: var(--grid-dot); color: var(--accent-teal-dark); }

/* Sections */
.section-head {
display: flex; align-items: baseline; justify-content: space-between;
margin-bottom: 8px;
}
.section-head h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
.view-title { margin-bottom: 12px; }
.view-title h2 { font-size: 1.1rem; font-weight: 700; margin: 0; }
.muted { color: var(--ink-muted); font-weight: 500; font-size: 0.9rem; }

.btn { border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
.btn-add { background: var(--accent-teal); color: #fff; }
.btn-add:active { background: var(--accent-teal-dark); }
.btn-primary { background: var(--accent-teal); color: #fff; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-danger { background: var(--accent-red); color: #fff; }

/* Mise en page de l'accueil : tableau blanc en colonne latérale, sur toute la hauteur */
.home-layout { display: flex; gap: 20px; align-items: stretch; margin-top: 10px; }
.home-sidebar { flex: 0 0 260px; display: flex; flex-direction: column; margin-bottom: 0; }
.home-main { flex: 1; min-width: 0; }
@media (max-width: 720px) {
.home-layout { flex-direction: column; }
.home-sidebar { flex: 1 1 auto; }
}

/* Whiteboard */
.board-section { margin-bottom: 28px; }
.whiteboard-canvas {
position: relative;
background-color: var(--surface);
background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
background-size: 18px 18px;
border: 1px solid var(--line);
border-radius: 10px;
min-height: 260px;
max-height: 420px;
overflow: auto;
padding: 4px;
}
.home-sidebar .whiteboard-canvas { flex: 1; max-height: none; }
@media (max-width: 720px) {
.home-sidebar .whiteboard-canvas { max-height: 420px; flex: none; }
}
.empty-hint { color: var(--ink-muted); font-size: 0.85rem; padding: 14px; margin: 0; }
.empty-hint--sm { padding: 4px 2px; font-size: 0.78rem; }

/* Post-it notes */
.note {
border-radius: 4px;
padding: 8px 9px 20px;
font-size: 0.85rem;
line-height: 1.3;
box-shadow: 1px 2px 4px rgba(0,0,0,0.18);
touch-action: none;
cursor: grab;
word-break: break-word;
}
.note--free {
position: absolute;
width: 118px;
min-height: 82px;
}
.note--flow {
position: relative;
width: 100%;
margin-bottom: 8px;
padding-bottom: 18px;
}
.note-text { white-space: pre-wrap; user-select: none; }
.note-delete {
position: absolute; top: 2px; right: 4px;
background: none; border: none; cursor: pointer;
font-size: 1rem; line-height: 1; color: rgba(0,0,0,0.45);
padding: 2px 4px;
}
.note-delete:hover { color: rgba(0,0,0,0.75); }
.note-ghost { opacity: 0.9; pointer-events: none; }
.note-ghost .note-delete { display: none; }
.note-source-hidden { visibility: hidden; }

/* Backlog en format calendrier, mois par mois, en scroll horizontal */
.calendar-scroll-wrap { display: flex; align-items: center; gap: 6px; }
.calendar-months {
display: flex;
gap: 14px;
overflow-x: auto;
scroll-behavior: smooth;
scroll-snap-type: x proximity;
touch-action: pan-x;
padding-bottom: 6px;
flex: 1;
min-width: 0;
}
.cal-arrow {
flex: 0 0 auto;
width: 30px; height: 30px;
border-radius: 50%;
border: 1px solid var(--line);
background: var(--surface);
color: var(--ink-muted);
cursor: pointer;
font-size: 1.1rem;
line-height: 1;
display: flex; align-items: center; justify-content: center;
}
.cal-arrow:hover { border-color: var(--accent-teal); color: var(--accent-teal); }
.month-block {
background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
flex: 0 0 250px;
scroll-snap-align: start;
}
.month-block--current { border-color: var(--accent-teal); box-shadow: 0 0 0 1px var(--accent-teal); }
.month-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; text-transform: capitalize; }
.month-grid {
display: grid;
grid-template-columns: 24px repeat(7, 1fr);
gap: 2px;
}
.dow-cell { font-size: 0.62rem; color: var(--ink-muted); text-align: center; padding: 3px 0; font-weight: 600; }
.week-num-cell, .day-cell {
position: relative;
min-height: 30px;
display: flex; align-items: center; justify-content: center;
font-size: 0.72rem;
border-radius: 4px;
cursor: pointer;
}
.week-num-cell { color: var(--ink-muted); font-weight: 700; background: var(--page-bg); }
.week-num-cell.current { color: #fff; background: var(--accent-red); }
.day-cell { flex-direction: column; }
.day-cell:hover, .week-num-cell:hover { background: #EDEFEE; }
.week-num-cell.current:hover { background: var(--accent-red); }
.day-cell--empty { cursor: default; }
.day-cell--empty:hover { background: none; }
.day-cell.today .day-num { color: var(--accent-red); font-weight: 700; }
.cell-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }

/* Matrice de priorités (Eisenhower) */
.matrix-section { margin-bottom: 28px; }
.matrix-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.matrix-cell {
background: var(--surface);
border: 2px solid var(--accent-teal);
border-radius: 10px;
padding: 10px;
min-height: 150px;
display: flex;
flex-direction: column;
}
.matrix-cell-head {
display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
margin-bottom: 8px;
}
.matrix-cell-head span { font-size: 0.78rem; font-weight: 700; color: var(--accent-teal-dark); line-height: 1.25; }
.matrix-cell-body {
flex: 1;
min-height: 90px;
border-radius: 8px;
padding: 2px;
transition: outline-color 0.1s;
}
@media (max-width: 480px) {
.matrix-grid { grid-template-columns: 1fr; }
}

/* Kanban */
.kanban-row {
display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
touch-action: pan-x;
}
.kanban-column { min-width: 172px; max-width: 172px; flex: 0 0 auto; }
.column-header {
font-size: 0.8rem; font-weight: 600; padding: 8px 4px; border-bottom: 2px solid var(--line);
margin-bottom: 8px; cursor: default;
}
.column-header[data-nav] { cursor: pointer; }
.column-header[data-nav]:hover { color: var(--accent-teal); }
.column-header--today { color: var(--accent-red); }
.column-header--static { cursor: default; }
.col-date { font-weight: 500; color: var(--ink-muted); }
.chev { color: var(--ink-muted); }
.column-body {
min-height: 130px;
border-radius: 8px;
padding: 2px;
transition: outline-color 0.1s;
}
[data-dropzone].dropzone-hover { outline: 2px dashed var(--accent-teal); outline-offset: -1px; }
.btn-add-col {
width: 100%; margin-top: 2px; background: transparent;
border: 1px dashed var(--line); color: var(--ink-muted);
border-radius: 6px; padding: 6px; font-size: 0.75rem;
}
.btn-add-col:hover { border-color: var(--accent-teal); color: var(--accent-teal); }

/* Modal */
.overlay {
position: fixed; inset: 0; background: rgba(36,48,58,0.45);
display: flex; align-items: flex-end; justify-content: center;
z-index: 1000; padding: 0;
}
.modal-card {
background: var(--surface); border-radius: 14px 14px 0 0;
padding: 18px 16px 20px; width: 100%; max-width: 480px;
}
.modal-card--sm { border-radius: 14px; margin: auto; }
.modal-card h3 { margin: 0 0 10px; font-size: 1rem; }
.modal-card textarea {
width: 100%; border: 1px solid var(--line); border-radius: 8px;
padding: 10px; font: inherit; font-size: 0.9rem; resize: vertical;
}
.swatches { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
.swatch {
width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
cursor: pointer; padding: 0;
}
.swatch.selected { border-color: var(--ink); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

@media (min-width: 620px) {
.overlay { align-items: center; }
.modal-card { border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) {
* { transition: none !important; animation: none !important; }
}
:focus-visible { outline: 2px solid var(--accent-teal); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app-shell" id="app">Chargement…</div>
<script>
(function () {
"use strict";

var COLORS = ["#FBE270", "#F6A8C0", "#9FE0B0", "#93CBEF", "#F7B27A", "#C6A8EC"];
var DAY_KEYS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
var DAY_LABELS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var MONTH_NAMES = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var STORAGE_KEY = "organisateur-notes-v1";
var UNLOCK_KEY = "organisateur-unlocked-v1";
var PASSWORD_HASH = "6d8d5b98882508d30ed1162ca709356792070489f0518872b21169d30368e910";

var notes = [];
var currentView = { type: "home" };
var modalState = null;
var draftColor = COLORS[0];
var dragState = null;
var lastHighlighted = null;
var lastRenderedViewType = null;

/* ---------- Date / semaine helpers ---------- */
function pad(n) { return n < 10 ? "0" + n : "" + n; }

function isoWeekInfo(date) {
var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
var dayNum = (d.getUTCDay() + 6) % 7;
d.setUTCDate(d.getUTCDate() - dayNum + 3);
var isoYear = d.getUTCFullYear();
var yearStart = new Date(Date.UTC(isoYear, 0, 1));
var weekNum = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
return { isoYear: isoYear, weekNum: weekNum };
}

function mondayOf(date) {
var d = new Date(date);
var dayNum = (d.getDay() + 6) % 7;
d.setDate(d.getDate() - dayNum);
d.setHours(0, 0, 0, 0);
return d;
}

function buildYearWeeks(year) {
var jan1 = new Date(year, 0, 1);
var cursor = mondayOf(jan1);
var dec31 = new Date(year, 11, 31);
var weeks = [];
while (cursor <= dec31) {
var weekStart = new Date(cursor);
var weekEnd = new Date(cursor);
weekEnd.setDate(weekEnd.getDate() + 6);
var info = isoWeekInfo(weekStart);
var weekKey = info.isoYear + "-W" + pad(info.weekNum);
weeks.push({ weekKey: weekKey, weekNum: info.weekNum, start: weekStart, end: weekEnd });
cursor.setDate(cursor.getDate() + 7);
}
return weeks;
}

var todayInfo = isoWeekInfo(mondayOf(new Date()));
var TODAY_WEEK_KEY = todayInfo.isoYear + "-W" + pad(todayInfo.weekNum);

function formatWeekRange(start, end) {
var fmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
return fmt.format(start) + " – " + fmt.format(end);
}

/* ---------- Stockage (localStorage : fonctionne sur n'importe quel hébergement) ---------- */
function loadNotes() {
try {
var raw = localStorage.getItem(STORAGE_KEY);
notes = raw ? JSON.parse(raw) : [];
} catch (e) {
notes = [];
}
}

function saveNotes() {
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
} catch (e) {
console.error("Échec de la sauvegarde", e);
}
}

/* ---------- Utilitaires ---------- */
function escapeHtml(str) {
return String(str).replace(/[&<>"']/g, function (ch) {
return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
});
}

function genId() {
return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function hashRotation(id) {
var h = 0;
for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
return (Math.abs(h) % 7) - 3;
}

function findNoteById(id) {
for (var i = 0; i < notes.length; i++) if (notes[i].id === id) return notes[i];
return null;
}

/* ---------- Rendu des post-it ---------- */
function renderFreeNote(note) {
var rot = hashRotation(note.id);
return '<div class="note note--free" data-id="' + note.id + '" style="left:' + note.x + 'px; top:' + note.y + 'px; background:' + note.color + '; transform:rotate(' + rot + 'deg);">' +
'<button class="note-delete" data-id="' + note.id + '" aria-label="Supprimer">×</button>' +
'<div class="note-text">' + escapeHtml(note.text) + '</div></div>';
}

function renderFlowNote(note) {
return '<div class="note note--flow" data-id="' + note.id + '" style="background:' + note.color + ';">' +
'<button class="note-delete" data-id="' + note.id + '" aria-label="Supprimer">×</button>' +
'<div class="note-text">' + escapeHtml(note.text) + '</div></div>';
}

function emptyColHint() { return '<p class="empty-hint empty-hint--sm">Vide</p>'; }

var MATRIX_QUADRANTS = [
{ key: "urgent-important", label: "Important et urgent" },
{ key: "urgent-not-important", label: "Urgent mais pas important" },
{ key: "important-not-urgent", label: "Important mais pas urgent" },
{ key: "neither", label: "Pas urgent et pas important" }
];

function renderMatrix() {
var cellsHtml = MATRIX_QUADRANTS.map(function (q) {
var qNotes = notes.filter(function (n) { return n.location === "matrix" && n.quadrant === q.key; });
return '<div class="matrix-cell">' +
'<div class="matrix-cell-head"><span>' + q.label + '</span><button class="btn-add-col" style="width:auto;" data-add-loc="matrix" data-quadrant="' + q.key + '">+ Ajouter</button></div>' +
'<div class="matrix-cell-body" data-dropzone="matrix:' + q.key + '">' +
(qNotes.map(renderFlowNote).join("") || emptyColHint()) +
'</div></div>';
}).join("");
return '<section class="matrix-section">' +
'<div class="matrix-grid">' + cellsHtml + '</div>' +
'</section>';
}

/* ---------- Vues ---------- */
function renderHeader() {
if (currentView.type === "day") {
return '<header class="app-header app-header--day">' +
'<button type="button" class="back-arrow" data-nav="week" data-week="' + currentView.weekKey + '" aria-label="Retour à la semaine">‹</button>' +
'<span class="brand brand--link" data-nav="home">Todo TDAH Friendly</span>' +
'</header>';
}
var crumb = "";
if (currentView.type === "week") {
var backArrow = '<button type="button" class="back-arrow" data-nav="home" aria-label="Retour à l\'accueil">‹</button>';
crumb = backArrow + '<span class="crumb" data-nav="home">Todo TDAH Friendly</span>';
crumb += ' <span class="sep">/</span> <span class="crumb crumb--active" data-nav="week" data-week="' + currentView.weekKey + '">Semaine</span>';
}
var postItBtn = currentView.type === "home" ? '<button class="btn btn-add" data-add-loc="whiteboard">+ Post-it</button>' : "";
return '<header class="app-header"><div class="brand">Todo TDAH Friendly</div>' +
'<div class="header-actions"><button class="btn-reset" data-action="lock">Verrouiller</button>' +
'<button class="btn-reset" data-action="reset">Réinitialiser</button>' +
postItBtn + '</div></header>' +
(crumb ? '<nav class="breadcrumb">' + crumb + '</nav>' : '');
}

function renderHome() {
var year = new Date().getFullYear();
var currentMonthIdx = new Date().getMonth();
var wbNotes = notes.filter(function (n) { return n.location === "whiteboard"; });
var wbHtml = wbNotes.length ? wbNotes.map(renderFreeNote).join("") : '<p class="empty-hint">Aucun post-it pour l\'instant. Touche « + Post-it » pour en ajouter un.</p>';
var monthsHtml = MONTH_NAMES.map(function (name, idx) { return renderMonthBlock(year, idx, name, idx === currentMonthIdx); }).join("");
return '<div class="home-layout">' +
'<section class="board-section home-sidebar">' +
'<div class="whiteboard-canvas" data-dropzone="whiteboard">' + wbHtml + '</div>' +
'</section>' +
'<div class="home-main">' +
renderMatrix() +
'<section class="backlog-section">' +
'<div class="calendar-scroll-wrap">' +
'<button type="button" class="cal-arrow" data-cal-scroll="-1" aria-label="Mois précédents">‹</button>' +
'<div class="calendar-months" id="calendar-months">' + monthsHtml + '</div>' +
'<button type="button" class="cal-arrow" data-cal-scroll="1" aria-label="Mois suivants">›</button>' +
'</div>' +
'</section>' +
'</div>' +
'</div>';
}

function buildMonthGrid(year, monthIndex) {
var firstOfMonth = new Date(year, monthIndex, 1);
var lastOfMonth = new Date(year, monthIndex + 1, 0);
var gridStart = mondayOf(firstOfMonth);
var gridEnd = new Date(lastOfMonth);
var endDayNum = (gridEnd.getDay() + 6) % 7;
gridEnd.setDate(gridEnd.getDate() + (6 - endDayNum));

var rows = [];
var cursor = new Date(gridStart);
while (cursor <= gridEnd) {
var info = isoWeekInfo(cursor);
var weekKey = info.isoYear + "-W" + pad(info.weekNum);
var days = [];
for (var i = 0; i < 7; i++) {
var d = new Date(cursor); d.setDate(d.getDate() + i);
days.push({ date: d, inMonth: d.getMonth() === monthIndex, dayKey: DAY_KEYS[i] });
}
rows.push({ weekKey: weekKey, weekNum: info.weekNum, days: days });
cursor.setDate(cursor.getDate() + 7);
}
return rows;
}

function renderMonthBlock(year, monthIndex, name, isCurrent) {
var rows = buildMonthGrid(year, monthIndex);
var todayStr = new Date().toDateString();
var dowHtml = ["Lu", "Ma", "Me", "Je", "Ve", "Sa", "Di"].map(function (d) {
return '<div class="dow-cell">' + d + '</div>';
}).join("");

var rowsHtml = rows.map(function (row) {
var isCurrentWeek = row.weekKey === TODAY_WEEK_KEY;
var weekAssigned = notes.filter(function (n) { return n.weekKey === row.weekKey && n.location === "week"; });
var weekDot = weekAssigned.length ? '<span class="cell-dot" style="background:' + weekAssigned[0].color + '"></span>' : "";
var weekCell = '<div class="week-num-cell' + (isCurrentWeek ? " current" : "") + '" data-dropzone="week:' + row.weekKey + '" data-nav="week" data-week="' + row.weekKey + '">' + row.weekNum + weekDot + '</div>';

var dayCells = row.days.map(function (d) {
if (!d.inMonth) return '<div class="day-cell day-cell--empty"></div>';
var isToday = d.date.toDateString() === todayStr;
var dNotes = notes.filter(function (n) { return n.location === "day" && n.weekKey === row.weekKey && n.day === d.dayKey; });
var dot = dNotes.length ? '<span class="cell-dot" style="background:' + dNotes[0].color + '"></span>' : "";
return '<div class="day-cell' + (isToday ? " today" : "") + '" data-dropzone="day:' + row.weekKey + ':' + d.dayKey + '" data-nav="day" data-week="' + row.weekKey + '" data-day="' + d.dayKey + '">' +
'<span class="day-num">' + d.date.getDate() + '</span>' + dot + '</div>';
}).join("");

return weekCell + dayCells;
}).join("");

return '<div class="month-block' + (isCurrent ? ' month-block--current' : '') + '"' + (isCurrent ? ' id="month-current"' : '') + '><div class="month-title">' + name + '</div>' +
'<div class="month-grid"><div class="dow-cell"></div>' + dowHtml + rowsHtml + '</div></div>';
}

function renderWeekView(weekKey) {
var weeks = buildYearWeeks(new Date().getFullYear());
var w = null;
for (var i = 0; i < weeks.length; i++) if (weeks[i].weekKey === weekKey) { w = weeks[i]; break; }
if (!w) {
return '<div class="view-title"><h2>Semaine introuvable</h2></div><p class="empty-hint">Cette semaine ne fait plus partie du backlog de l\'année en cours.</p>';
}
var backlogNotes = notes.filter(function (n) { return n.location === "week" && n.weekKey === weekKey; });
var fmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
var todayStr = new Date().toDateString();

var backlogCol = '<div class="kanban-column">' +
'<div class="column-header column-header--static">À faire (semaine)</div>' +
'<div class="column-body" data-dropzone="week:' + weekKey + '">' +
(backlogNotes.map(renderFlowNote).join("") || emptyColHint()) +
'<button class="btn-add-col" data-add-loc="week" data-week="' + weekKey + '">+ Ajouter</button>' +
'</div></div>';

var dayCols = DAY_KEYS.map(function (dk, idx) {
var d = new Date(w.start); d.setDate(d.getDate() + idx);
var isToday = d.toDateString() === todayStr;
var dNotes = notes.filter(function (n) { return n.location === "day" && n.weekKey === weekKey && n.day === dk; });
return '<div class="kanban-column">' +
'<div class="column-header' + (isToday ? " column-header--today" : "") + '" data-nav="day" data-week="' + weekKey + '" data-day="' + dk + '">' +
DAY_LABELS[idx] + ' <span class="col-date">' + fmt.format(d) + '</span> <span class="chev">›</span></div>' +
'<div class="column-body" data-dropzone="day:' + weekKey + ':' + dk + '">' +
(dNotes.map(renderFlowNote).join("") || emptyColHint()) +
'<button class="btn-add-col" data-add-loc="day" data-week="' + weekKey + '" data-day="' + dk + '">+ Ajouter</button>' +
'</div></div>';
}).join("");

return '<div class="view-title"><h2>Semaine ' + w.weekNum + ' <span class="muted">— ' + formatWeekRange(w.start, w.end) + '</span></h2></div>' +
'<div class="kanban-row">' + backlogCol + dayCols + '</div>';
}

function renderDayView(weekKey, day) {
var weeks = buildYearWeeks(new Date().getFullYear());
var w = null;
for (var i = 0; i < weeks.length; i++) if (weeks[i].weekKey === weekKey) { w = weeks[i]; break; }
if (!w) {
return '<div class="view-title"><h2>Jour introuvable</h2></div><p class="empty-hint">Cette semaine ne fait plus partie du backlog de l\'année en cours.</p>';
}
var idx = DAY_KEYS.indexOf(day);
var d = new Date(w.start); d.setDate(d.getDate() + idx);
var fmtFull = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long" });
var statuses = [
{ key: "todo", label: "À faire du jour" },
{ key: "in-progress", label: "En cours" },
{ key: "waiting", label: "En attente" },
{ key: "done", label: "Terminé" }
];
var cols = statuses.map(function (s) {
var sNotes = notes.filter(function (n) { return n.location === "day" && n.weekKey === weekKey && n.day === day && n.status === s.key; });
return '<div class="kanban-column">' +
'<div class="column-header column-header--static">' + s.label + '</div>' +
'<div class="column-body" data-dropzone="daystatus:' + weekKey + ':' + day + ':' + s.key + '">' +
(sNotes.map(renderFlowNote).join("") || emptyColHint()) +
'<button class="btn-add-col" data-add-loc="day" data-week="' + weekKey + '" data-day="' + day + '" data-status="' + s.key + '">+ Ajouter</button>' +
'</div></div>';
}).join("");
return '<div class="view-title"><h2>' + DAY_LABELS[idx] + ' <span class="muted">' + fmtFull.format(d) + '</span></h2></div>' +
'<div class="kanban-row">' + cols + '</div>';
}

function renderModal() {
if (!modalState) return "";
if (modalState.type === "confirm") {
return '<div class="overlay" data-overlay="1"><div class="modal-card modal-card--sm">' +
'<p>' + escapeHtml(modalState.message) + '</p>' +
'<div class="modal-actions">' +
'<button class="btn btn-ghost" data-action="cancel-confirm">Annuler</button>' +
'<button class="btn btn-danger" data-action="confirm-yes">Confirmer</button>' +
'</div></div></div>';
}
var isEdit = modalState.mode === "edit";
var currentText = "";
if (isEdit) {
var n = findNoteById(modalState.noteId);
currentText = n ? n.text : "";
}
var swatches = COLORS.map(function (c) {
return '<button type="button" class="swatch' + (c === draftColor ? " selected" : "") + '" data-color="' + c + '" style="background:' + c + '"></button>';
}).join("");
return '<div class="overlay" data-overlay="1"><div class="modal-card">' +
'<h3>' + (isEdit ? "Modifier le post-it" : "Nouveau post-it") + '</h3>' +
'<textarea id="note-text-input" rows="3" placeholder="Écris ta tâche…">' + escapeHtml(currentText) + '</textarea>' +
'<div class="swatches">' + swatches + '</div>' +
'<div class="modal-actions">' +
(isEdit ? '<button class="btn btn-danger" data-action="delete-note">Supprimer</button>' : "") +
'<button class="btn btn-ghost" data-action="cancel-modal">Annuler</button>' +
'<button class="btn btn-primary" data-action="save-note">' + (isEdit ? "Enregistrer" : "Ajouter") + '</button>' +
'</div></div></div>';
}

/* ---------- Rendu principal ---------- */
function render() {
try {
var app = document.getElementById("app");
var enteringHome = currentView.type === "home" && lastRenderedViewType !== "home";
var html = renderHeader();
if (currentView.type === "home") html += renderHome();
else if (currentView.type === "week") html += renderWeekView(currentView.weekKey);
else if (currentView.type === "day") html += renderDayView(currentView.weekKey, currentView.day);
html += renderModal();
app.innerHTML = html;
attachHandlers();
if (enteringHome) scrollToCurrentMonth();
lastRenderedViewType = currentView.type;
} catch (e) {
console.error(e);
document.getElementById("app").innerHTML = "<p>Une erreur est survenue : " + escapeHtml(e.message) + "</p>";
}
}

function scrollToCurrentMonth() {
var current = document.getElementById("month-current");
if (current) current.scrollIntoView({ inline: "start", block: "nearest" });
}

function attachHandlers() {
document.querySelectorAll("[data-nav]").forEach(function (el) {
el.addEventListener("click", function () {
handleNav(el.dataset.nav, el.dataset.week, el.dataset.day);
});
});

document.querySelectorAll("[data-add-loc]").forEach(function (btn) {
btn.addEventListener("click", function () {
openCreateNote({
location: btn.dataset.addLoc,
weekKey: btn.dataset.week || null,
day: btn.dataset.day || null,
status: btn.dataset.status || null,
quadrant: btn.dataset.quadrant || null
});
});
});

document.querySelectorAll('[data-action="reset"]').forEach(function (btn) {
btn.addEventListener("click", function () {
modalState = {
type: "confirm",
message: "Supprimer tous les post-it et repartir de zéro ?",
onConfirm: function () { notes = []; saveNotes(); currentView = { type: "home" }; history.replaceState(null, "", window.location.pathname + window.location.search); }
};
render();
});
});

document.querySelectorAll("[data-cal-scroll]").forEach(function (btn) {
btn.addEventListener("click", function () {
var dir = parseInt(btn.dataset.calScroll, 10);
var container = document.getElementById("calendar-months");
if (container) container.scrollBy({ left: dir * 264, behavior: "smooth" });
});
});

document.querySelectorAll('[data-action="lock"]').forEach(function (btn) {
btn.addEventListener("click", function () {
try { localStorage.removeItem(UNLOCK_KEY); } catch (e) {}
showGate();
});
});

document.querySelectorAll(".note").forEach(function (el) {
var note = findNoteById(el.dataset.id);
if (note) bindDraggable(el, note);
});

document.querySelectorAll(".note-delete").forEach(function (btn) {
btn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
btn.addEventListener("click", function (e) {
e.stopPropagation();
notes = notes.filter(function (n) { return n.id !== btn.dataset.id; });
saveNotes();
render();
});
});

if (modalState) {
var overlay = document.querySelector("[data-overlay]");
if (overlay) overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

document.querySelectorAll(".swatch").forEach(function (sw) {
sw.addEventListener("click", function () {
draftColor = sw.dataset.color;
document.querySelectorAll(".swatch").forEach(function (s) { s.classList.remove("selected"); });
sw.classList.add("selected");
});
});

var saveBtn = document.querySelector('[data-action="save-note"]');
if (saveBtn) saveBtn.addEventListener("click", saveEditor);

var cancelBtn = document.querySelector('[data-action="cancel-modal"]');
if (cancelBtn) cancelBtn.addEventListener("click", closeModal);

var delBtn = document.querySelector('[data-action="delete-note"]');
if (delBtn) delBtn.addEventListener("click", deleteEditingNote);

var confirmYes = document.querySelector('[data-action="confirm-yes"]');
if (confirmYes) confirmYes.addEventListener("click", function () {
var cb = modalState.onConfirm;
modalState = null;
if (cb) cb();
render();
});

var cancelConfirm = document.querySelector('[data-action="cancel-confirm"]');
if (cancelConfirm) cancelConfirm.addEventListener("click", closeModal);
}
}

/* ---------- Navigation via l'URL (#) pour que "Précédent" fonctionne ---------- */
function viewToHash(view) {
if (!view || view.type === "home") return "";
if (view.type === "week") return "week/" + encodeURIComponent(view.weekKey);
if (view.type === "day") return "day/" + encodeURIComponent(view.weekKey) + "/" + encodeURIComponent(view.day);
return "";
}

function hashToView() {
var raw = window.location.hash.replace(/^#/, "");
if (!raw) return { type: "home" };
var parts = raw.split("/").map(function (p) { return decodeURIComponent(p); });
if (parts[0] === "week" && parts[1]) return { type: "week", weekKey: parts[1] };
if (parts[0] === "day" && parts[1] && parts[2]) return { type: "day", weekKey: parts[1], day: parts[2] };
return { type: "home" };
}

function navigateTo(view) {
var hash = viewToHash(view);
var current = window.location.hash.replace(/^#/, "");
if (current === hash) {
currentView = view;
render();
} else {
currentView = view;
window.location.hash = hash;
/* le rendu est déclenché par l'évènement hashchange ci-dessous */
}
}

window.addEventListener("hashchange", function () {
currentView = hashToView();
render();
});

function handleNav(type, week, day) {
var view = null;
if (type === "home") view = { type: "home" };
else if (type === "week") view = { type: "week", weekKey: week };
else if (type === "day") view = { type: "day", weekKey: week, day: day };
if (view) navigateTo(view);
}

function closeModal() { modalState = null; render(); }

function openCreateNote(ctx) {
modalState = { type: "note-editor", mode: "create", context: ctx };
draftColor = COLORS[Math.floor(Math.random() * COLORS.length)];
render();
}

function openEditNote(note) {
modalState = { type: "note-editor", mode: "edit", noteId: note.id };
draftColor = note.color;
render();
}

function saveEditor() {
var ta = document.getElementById("note-text-input");
var text = ta ? ta.value.trim() : "";
if (!text) return;
if (modalState.mode === "edit") {
var n = findNoteById(modalState.noteId);
if (n) { n.text = text; n.color = draftColor; }
} else {
var ctx = modalState.context;
var note = {
id: genId(), text: text, color: draftColor,
location: ctx.location,
weekKey: ctx.weekKey || null,
day: ctx.day || null,
status: ctx.location === "day" ? (ctx.status || "todo") : null,
quadrant: ctx.location === "matrix" ? (ctx.quadrant || "neither") : null,
x: 0, y: 0,
createdAt: Date.now()
};
if (ctx.location === "whiteboard") {
var count = notes.filter(function (nn) { return nn.location === "whiteboard"; }).length;
note.x = 12 + (count % 2) * 130;
note.y = 12 + Math.floor(count / 2) * 96;
}
notes.push(note);
}
saveNotes();
modalState = null;
render();
}

function deleteEditingNote() {
if (modalState && modalState.mode === "edit") {
notes = notes.filter(function (n) { return n.id !== modalState.noteId; });
saveNotes();
}
modalState = null;
render();
}

/* ---------- Glisser-déposer (pointer events) ---------- */
function bindDraggable(el, note) {
el.addEventListener("pointerdown", function (e) {
if (e.button !== undefined && e.button !== 0) return;
var rect = el.getBoundingClientRect();
var state = {
note: note, el: el,
offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
startX: e.clientX, startY: e.clientY,
moved: false, ghost: null, pointerId: e.pointerId,
w: rect.width, h: rect.height
};
dragState = state;
try { el.setPointerCapture(e.pointerId); } catch (err) {}
el.addEventListener("pointermove", onDragMove);
el.addEventListener("pointerup", onDragEnd);
el.addEventListener("pointercancel", onDragEnd);
});
}

function onDragMove(e) {
var s = dragState;
if (!s) return;
var dx = e.clientX - s.startX, dy = e.clientY - s.startY;
if (!s.moved && Math.hypot(dx, dy) > 6) {
s.moved = true;
var ghost = s.el.cloneNode(true);
ghost.classList.add("note-ghost");
ghost.style.position = "fixed";
ghost.style.width = s.w + "px";
ghost.style.margin = "0";
ghost.style.zIndex = "999";
ghost.style.left = (e.clientX - s.offsetX) + "px";
ghost.style.top = (e.clientY - s.offsetY) + "px";
document.body.appendChild(ghost);
s.ghost = ghost;
s.el.classList.add("note-source-hidden");
}
if (s.moved && s.ghost) {
s.ghost.style.left = (e.clientX - s.offsetX) + "px";
s.ghost.style.top = (e.clientY - s.offsetY) + "px";
highlightDropzone(e.clientX, e.clientY);
}
}

function onDragEnd(e) {
var s = dragState;
if (!s) return;
s.el.removeEventListener("pointermove", onDragMove);
s.el.removeEventListener("pointerup", onDragEnd);
s.el.removeEventListener("pointercancel", onDragEnd);
try { s.el.releasePointerCapture(s.pointerId); } catch (err) {}
clearDropzoneHighlight();
if (s.moved) {
if (s.ghost) s.ghost.remove();
var dropEl = document.elementFromPoint(e.clientX, e.clientY);
var zoneEl = dropEl ? dropEl.closest("[data-dropzone]") : null;
if (zoneEl) applyDrop(s.note, zoneEl, e.clientX, e.clientY, s.offsetX, s.offsetY);
dragState = null;
render();
} else {
dragState = null;
openEditNote(s.note);
}
}

function highlightDropzone(x, y) {
var el = document.elementFromPoint(x, y);
var zone = el ? el.closest("[data-dropzone]") : null;
if (zone !== lastHighlighted) {
if (lastHighlighted) lastHighlighted.classList.remove("dropzone-hover");
if (zone) zone.classList.add("dropzone-hover");
lastHighlighted = zone;
}
}

function clearDropzoneHighlight() {
if (lastHighlighted) lastHighlighted.classList.remove("dropzone-hover");
lastHighlighted = null;
}

function applyDrop(note, zoneEl, clientX, clientY, grabOffsetX, grabOffsetY) {
var zone = zoneEl.dataset.dropzone;
var parts = zone.split(":");
if (parts[0] === "whiteboard") {
var rect = zoneEl.getBoundingClientRect();
var scrollLeft = zoneEl.scrollLeft || 0, scrollTop = zoneEl.scrollTop || 0;
var x = clientX - rect.left + scrollLeft - grabOffsetX;
var y = clientY - rect.top + scrollTop - grabOffsetY;
note.location = "whiteboard";
note.x = Math.max(4, x);
note.y = Math.max(4, y);
note.weekKey = null; note.day = null; note.status = null; note.quadrant = null;
} else if (parts[0] === "week") {
note.location = "week"; note.weekKey = parts[1]; note.day = null; note.status = null; note.quadrant = null;
} else if (parts[0] === "day") {
note.location = "day"; note.weekKey = parts[1]; note.day = parts[2];
note.status = note.status || "todo";
note.quadrant = null;
} else if (parts[0] === "daystatus") {
note.location = "day"; note.weekKey = parts[1]; note.day = parts[2]; note.status = parts[3]; note.quadrant = null;
} else if (parts[0] === "matrix") {
note.location = "matrix"; note.quadrant = parts[1]; note.weekKey = null; note.day = null; note.status = null;
}
saveNotes();
}

/* ---------- Verrou par mot de passe ---------- */
function isUnlocked() {
try { return localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; }
}

function checkPassword(pw) {
var value = (pw || "").trim();
if (!window.crypto || !window.crypto.subtle) return Promise.resolve(false);
var enc = new TextEncoder().encode(value);
return window.crypto.subtle.digest("SHA-256", enc).then(function (buf) {
var bytes = Array.from(new Uint8Array(buf));
var hex = bytes.map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
return hex === PASSWORD_HASH;
});
}

function showGate() {
var app = document.getElementById("app");
app.innerHTML =
'<div class="gate"><div class="gate-card">' +
'<div class="gate-brand">Todo TDAH Friendly</div>' +
'<p class="gate-hint">Cet espace est privé.</p>' +
'<input type="password" id="gate-password" placeholder="Mot de passe" autocomplete="current-password">' +
'<button class="btn btn-primary" id="gate-submit">Entrer</button>' +
'<p class="gate-error" id="gate-error" style="display:none;">Mot de passe incorrect.</p>' +
'</div></div>';
var input = document.getElementById("gate-password");
var submit = document.getElementById("gate-submit");
var tryUnlock = function () {
checkPassword(input.value).then(function (ok) {
if (ok) {
try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
render();
} else {
document.getElementById("gate-error").style.display = "block";
input.value = "";
input.focus();
}
});
};
submit.addEventListener("click", tryUnlock);
input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
input.focus();
}

/* ---------- Démarrage ---------- */
function init() {
loadNotes();
currentView = hashToView();
if (isUnlocked()) render(); else showGate();
}
init();
})();
</script>
</body>
